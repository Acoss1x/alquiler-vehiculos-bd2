spring.application.name=alquiler

# Credenciales locales (archivo ignorado por Git)
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL en la VM
spring.datasource.url=jdbc:postgresql://192.168.56.10:5432/alquiler_vehiculos
spring.datasource.username=admindb

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.data.mongodb.auto-index-creation=true
spring.jpa.open-in-view=false

# Correo para la recuperación de contraseña (usuario y clave en application-local.properties)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Dirección del front (a donde apunta el enlace del correo) y vigencia del enlace
app.frontend-url=http://localhost:4200
app.recuperacion.minutos=30